<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Jonkler: The One and Only</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="stage">
        <canvas id="screen"></canvas>
        <div id="touch">
            <div class="pad">
                <button data-a="left">&lt;</button>
                <button data-a="right">&gt;</button>
            </div>
            <div class="pad">
                <button data-a="down">DOWN</button>
                <button data-a="pie">PIE</button>
                <button data-a="bonk">BONK</button>
                <button data-a="jump">JUMP</button>
            </div>
        </div>
    </main>
    <script src="js/audio.js"></script>
    <script src="js/sprites.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
